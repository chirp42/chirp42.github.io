<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>chirp42 · 开发记录与业余无线电题库</title>
<meta name="description" content="开发记录与业余无线电台操作技术能力验证模拟考试。">
<style>
  :root {
    --bg: #f6f7f9;
    --fg: #1c1e21;
    --muted: #6b7280;
    --card: #ffffff;
    --line: #e3e5e9;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --card: #1f2227;
      --line: #303338;
      --accent: #7aa2f7;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  main {
    width: 100%;
    max-width: 42rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: clamp(1.5rem, 5vw, 2.75rem);
  }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 5vw, 2rem);
    line-height: 1.3;
    letter-spacing: -0.01em;
  }
  .sub { margin: .5rem 0 0; color: var(--muted); }
  .rule { height: 1px; background: var(--line); border: 0; margin: 1.75rem 0; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .75rem; }
  li {
    display: flex;
    gap: .75rem;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .soon { color: var(--muted); }
  .tag {
    font-size: .75rem;
    padding: .15rem .5rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    white-space: nowrap;
  }
  footer {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    display: flex;
    gap: .75rem;
    justify-content: space-between;
    flex-wrap: wrap;
    font-size: .875rem;
    color: var(--muted);
  }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>chirp42</h1>
  <p class="sub">开发记录 &amp; 业余无线电台操作技术能力验证 · 模拟考试</p>

  <hr class="rule">

  <ul>
    <li>
      <a href="/quiz/">题库应用（A / B / C 三级）</a>
      <span class="tag">顺序 / 随机练习</span>
    </li>
    <li>
      <span>开发记录</span>
      <span class="tag soon">v0.7 接入</span>
    </li>
  </ul>

  <footer>
    <span>站点 v0.5.8</span>
    <span><a href="https://github.com/chirp42/chirp42.github.io">GitHub 仓库</a></span>
  </footer>
</main>
</body>
</html>
